<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Soundroom | Music Player</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root{--bg:#15141d;--panel:#211f2c;--soft:#2e2b3b;--ink:#faf7f0;--muted:#aaa5b4;--line:#ffffff1f;--accent:#ffbd6a;--pink:#ec6a82;--sans:"Manrope",sans-serif;--mono:"DM Mono",monospace}
		*{box-sizing:border-box} body{min-height:100vh;margin:0;padding:20px;color:var(--ink);background:radial-gradient(circle at 12% 8%,#3b2547,transparent 34%),radial-gradient(circle at 90% 90%,#402a24,transparent 32%),var(--bg);font-family:var(--sans)} button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}
		.app{display:grid;grid-template-columns:minmax(0,1fr) 310px;width:min(1160px,100%);min-height:720px;margin:auto;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#211f2ceb;box-shadow:0 28px 90px #0006}.player{display:flex;flex-direction:column;padding:clamp(24px,5vw,62px)}.topbar,.bottom{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em}.mark{display:grid;width:30px;height:30px;place-items:center;color:var(--bg);background:var(--accent);border-radius:50%}.mono{color:var(--muted);font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase}.status{color:var(--muted);font-size:.75rem}.status:before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 13px var(--accent)}
		.art-wrap{position:relative;width:min(100%,370px);aspect-ratio:1;margin:auto;padding:20px}.art-wrap:before,.art-wrap:after{content:"";position:absolute;border:1px solid #ffbd6a40;border-radius:50%;inset:0;animation:orbit 18s linear infinite}.art-wrap:after{inset:11%;border-color:#ec6a8240;animation-direction:reverse;animation-duration:12s}.art{position:relative;z-index:1;display:grid;width:100%;height:100%;place-items:center;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,#ffbd6a,#d24c7c 49%,#443565);box-shadow:0 25px 60px #0006}.art:before{content:"";width:48%;height:48%;border:1px solid #fff8;border-radius:50%;box-shadow:0 0 0 26px #fff1,0 0 0 57px #fff1}.art:after{content:"✦";position:absolute;color:#fffc;font-size:3.5rem}.art.playing{animation:spin 8s linear infinite}.info{margin-bottom:26px;text-align:center}.info h1{margin:7px 0 2px;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.06em}.info p{margin:0;color:var(--muted)}.progress{width:min(100%,620px);margin:0 auto}.range{--value:0%;width:100%;height:5px;appearance:none;border-radius:5px;background:linear-gradient(to right,var(--accent) var(--value),#fff2 var(--value));cursor:pointer}.range::-webkit-slider-thumb{width:15px;height:15px;appearance:none;border:3px solid var(--accent);border-radius:50%;background:var(--panel)}.time{display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font: .68rem var(--mono)}.controls{display:flex;justify-content:center;align-items:center;gap:clamp(12px,4vw,28px);margin:30px 0 24px}.control{display:grid;width:42px;height:42px;place-items:center;background:transparent;color:var(--muted);transition:.2s}.control:hover{color:var(--ink);transform:translateY(-2px)}.play{width:66px;height:66px;color:var(--bg);background:var(--accent);border-radius:50%;font-size:1.35rem}.play:hover{color:var(--bg);background:#ffd394;transform:scale(1.05)}.volume{display:flex;align-items:center;gap:10px;width:min(210px,45%);color:var(--muted)}.autoplay{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.78rem;cursor:pointer}.toggle{position:relative;width:34px;height:19px;border-radius:12px;background:var(--soft)}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:.2s}.autoplay input{position:absolute;opacity:0}.autoplay input:checked+.toggle{background:var(--pink)}.autoplay input:checked+.toggle:after{background:var(--ink);transform:translateX(15px)}
		.playlist{padding:35px 23px;border-left:1px solid var(--line);background:#15141d66}.playlist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.playlist h2{margin:0;font-size:1.1rem}.count{color:var(--muted);font:.7rem var(--mono)}.songs{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}.song{display:grid;grid-template-columns:28px 1fr 30px;align-items:center;gap:8px;width:100%;padding:13px 8px;border-radius:8px;color:var(--muted);text-align:left;background:transparent}.song:hover,.song.active{color:var(--ink);background:var(--soft)}.song-number{font:.7rem var(--mono);text-align:center}.active .song-number{color:var(--accent)}.song-title,.song-artist{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song-title{font-size:.82rem;font-weight:700}.song-artist,.song-duration{font-size:.7rem}.song-duration{font-family:var(--mono)}.hint{margin-top:35px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.7rem;line-height:1.8}kbd{padding:2px 5px;border:1px solid var(--line);border-radius:3px;color:var(--ink);font:.65rem var(--mono)}
		@keyframes spin{to{transform:rotate(360deg)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(max-width:820px){.app{grid-template-columns:1fr}.playlist{border-top:1px solid var(--line);border-left:0}.songs{display:grid;grid-template-columns:repeat(2,1fr)}.hint{display:none}}@media(max-width:520px){body{padding:10px}.app{border-radius:16px}.player{padding:22px 17px 30px}.art-wrap{width:min(100%,290px);margin:55px auto 38px}.bottom{align-items:flex-start;flex-direction:column}.volume{width:100%}.songs{grid-template-columns:1fr}}
	</style>
</head>
<body>
	<main class="app">
		<section class="player">
			<div class="topbar"><div class="brand"><span class="mark">♪</span> soundroom</div><span class="status" id="status">Ready to play</span></div>
			<div class="art-wrap"><div class="art" id="art"></div></div>
			<div class="info"><span class="mono" id="trackNumber"></span><h1 id="title">Loading...</h1><p id="artist"></p></div>
			<div class="progress"><input class="range" id="seek" type="range" min="0" max="100" value="0" aria-label="Song progress"><div class="time"><span id="current">0:00</span><span id="length">0:00</span></div></div>
			<div class="controls"><button class="control" id="previous" aria-label="Previous song">↶</button><button class="control" id="back" aria-label="Back ten seconds">−10</button><button class="control play" id="play" aria-label="Play">▶</button><button class="control" id="forward" aria-label="Forward ten seconds">+10</button><button class="control" id="next" aria-label="Next song">↷</button></div>
			<div class="bottom"><label class="volume">◖<input class="range" id="volume" type="range" min="0" max="1" step=".01" value=".75" aria-label="Volume">◉</label><label class="autoplay"><input id="autoplay" type="checkbox" checked><span class="toggle"></span> Autoplay next</label></div>
		</section>
		<aside class="playlist"><div class="playlist-head"><h2>Up next</h2><span class="count" id="count"></span></div><ol class="songs" id="songs"></ol><p class="hint">Use <kbd>Space</kbd> to play or pause<br>Use <kbd>←</kbd> <kbd>→</kbd> to change songs</p></aside>
	</main>
	<audio id="audio" preload="metadata"></audio>
	<script>
		const tracks = [
			{ title: "SoundHelix One", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
			{ title: "SoundHelix Two", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
			{ title: "SoundHelix Three", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
		];
		const $ = id => document.getElementById(id); const audio = $("audio"); let index = 0;
		const time = seconds => Number.isFinite(seconds) ? `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}` : "0:00";
		function renderSongs() { $("songs").innerHTML = tracks.map((track, i) => `<li><button class="song${i === index ? " active" : ""}" data-index="${i}"><span class="song-number">${String(i + 1).padStart(2, "0")}</span><span><span class="song-title">${track.title}</span><span class="song-artist">${track.artist}</span></span><span class="song-duration">${track.duration || "—"}</span></button></li>`).join(""); }
		function load(i, autoplay = false) { index = (i + tracks.length) % tracks.length; const track = tracks[index]; audio.src = track.src; $("title").textContent = track.title; $("artist").textContent = track.artist; $("trackNumber").textContent = `TRACK ${String(index + 1).padStart(2, "0")} / ${String(tracks.length).padStart(2, "0")}`; $("seek").value = 0; $("current").textContent = "0:00"; renderSongs(); if (autoplay) play(); }
		function play() { audio.play().then(() => { $("play").textContent = "❚❚"; $("play").setAttribute("aria-label", "Pause"); $("status").textContent = "Now playing"; $("art").classList.add("playing"); }).catch(() => $("status").textContent = "Press play to start"); }
		function pause() { audio.pause(); $("play").textContent = "▶"; $("play").setAttribute("aria-label", "Play"); $("status").textContent = "Paused"; $("art").classList.remove("playing"); }
		$("play").onclick = () => audio.paused ? play() : pause(); $("previous").onclick = () => load(index - 1, true); $("next").onclick = () => load(index + 1, true); $("back").onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 10); $("forward").onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
		$("seek").oninput = event => { const value = Number(event.target.value); event.target.style.setProperty("--value", `${value}%`); if (audio.duration) audio.currentTime = audio.duration * value / 100; }; $("volume").oninput = event => { audio.volume = event.target.value; event.target.style.setProperty("--value", `${event.target.value * 100}%`); }; $("songs").onclick = event => { const button = event.target.closest("button"); if (button) load(Number(button.dataset.index), true); };
		audio.onloadedmetadata = () => { $("length").textContent = time(audio.duration); tracks[index].duration = time(audio.duration); renderSongs(); }; audio.ontimeupdate = () => { $("current").textContent = time(audio.currentTime); const percent = audio.duration ? audio.currentTime / audio.duration * 100 : 0; $("seek").value = percent; $("seek").style.setProperty("--value", `${percent}%`); }; audio.onended = () => $("autoplay").checked ? load(index + 1, true) : pause();
		document.onkeydown = event => { if (event.target.matches("input")) return; if (event.code === "Space") { event.preventDefault(); audio.paused ? play() : pause(); } if (event.key === "ArrowRight") load(index + 1, true); if (event.key === "ArrowLeft") load(index - 1, true); }; audio.volume = .75; $("volume").style.setProperty("--value", "75%"); $("count").textContent = `${tracks.length} songs`; load(0);
	</script>
</body>
</html>
